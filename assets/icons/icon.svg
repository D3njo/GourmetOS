<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GourmetOS — Minimalist Cloche Edition">
  <defs>
    <!-- Luxury Deep Matte Obsidian/Charcoal Background -->
    <radialGradient id="luxBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#161513"/>
      <stop offset="60%" stop-color="#090807"/>
      <stop offset="100%" stop-color="#030303"/>
    </radialGradient>
    
    <!-- Polished Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#91732B"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#FFF3C4"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7C601C"/>
    </linearGradient>

    <!-- Razor Sharp Gold Border -->
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8E6615"/>
    </linearGradient>

    <!-- Signature Matcha Green Gradient -->
    <linearGradient id="matcha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5E1A5"/>
      <stop offset="100%" stop-color="#7CB342"/>
    </linearGradient>

    <!-- Ultra-luxurious Soft Glow (warm pass lighting) -->
    <filter id="passGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.90  0 0 0 0 0.75  0 0 0 0 0.35  0 0 0 0.20 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Solid matte background -->
  <rect width="512" height="512" rx="120" fill="url(#luxBg)"/>
  
  <!-- Outer hairline accent frame (pure luxury) -->
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="url(#goldEdge)" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Warm ambient culinary passing light -->
  <circle cx="256" cy="240" r="160" fill="#E5C158" opacity="0.03" filter="url(#passGlow)"/>

  <!-- GEOMETRIC BALANCE GUIDE (Subtle Zen-Circle) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldEdge)" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="2,6"/>

  <!-- THE MASTERPIECE: MINIMALIST CLOCHE & PLATE -->
  <g filter="url(#passGlow)">
    
    <!-- 1. The Plate Rim Line (Continuous, sweeping luxury arc) -->
    <path
      d="M 120 330 
         C 160 384, 352 384, 392 330"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="4.5"
      stroke-linecap="round"/>

    <!-- 2. The Cloche Base Line (Sleek, horizontal ground) -->
    <line 
      x1="138" y1="316" 
      x2="374" y2="316" 
      stroke="url(#goldGrad)" 
      stroke-width="3" 
      stroke-linecap="round"
      opacity="0.9"/>

    <!-- 3. The Minimalist Cloche Dome (Perfect, modern high-end dome curve) -->
    <path
      d="M 154 316 
         C 154 184, 210 148, 256 148
         C 302 148, 358 184, 358 316"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="5"
      stroke-miterlimit="10"
      stroke-linecap="round"/>

    <!-- 4. The Cloche Handle: Minimalist Ring & Weather Core (Sun/Adaptive Motif) -->
    <!-- Floating perfectly in the geometric center of the top -->
    <circle 
      cx="256" cy="124" r="14" 
      fill="none" 
      stroke="url(#goldEdge)" 
      stroke-width="3.5"/>
    <circle 
      cx="256" cy="124" r="5" 
      fill="#FFFDF0" 
      opacity="0.9"/>

  </g>

  <!-- WEATHER-ADAPTIVE CURRENTS (Abstract Orbit) -->
  <!-- A single, elegant golden wind ribbon sweeping dynamically behind the cloche and through the plate -->
  <path
    d="M 96 230 
       C 140 180, 240 280, 310 200
       C 360 140, 420 220, 380 290"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="1.5"
    stroke-opacity="0.25"
    stroke-linecap="round"
    stroke-dasharray="3,3"/>

  <!-- THE CUISINE SIGNATURES (Balanced focal accents) -->
  
  <!-- Single Perfect Saffron-Gold Drop (Michelin Quality) -->
  <circle cx="210" cy="276" r="6" fill="url(#goldGrad)" filter="url(#passGlow)"/>
  <circle cx="210" cy="276" r="11" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Single Perfect Pearl Drop (Pristine Standard) -->
  <circle cx="230" cy="284" r="3.5" fill="#FFFFFF" opacity="0.85"/>

  <!-- Signature Vibrant Matcha Green Leaf Droplet (Nature/Freshness/Adaptive) -->
  <!-- Set on the golden section to catch the eye instantly -->
  <g transform="translate(306 270)" filter="url(#passGlow)">
    <path
      d="M 0 -8 
         C 5 -8, 7 -2, 0 8 
         C -7 -2, -5 -8, 0 -8 Z"
      fill="url(#matcha)"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#7CB342" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- Chef's Precision Alignment Dots -->
  <circle cx="248" cy="336" r="2.5" fill="url(#goldGrad)" opacity="0.4"/>
  <circle cx="256" cy="336" r="2.5" fill="url(#goldGrad)" opacity="0.75"/>
  <circle cx="264" cy="336" r="2.5" fill="url(#goldGrad)" opacity="0.4"/>

  <!-- Minimal Brand Seal Monogram in Corner -->
  <g transform="translate(436 416)" opacity="0.85">
    <rect x="0" y="0" width="4" height="40" rx="2" fill="url(#matcha)"/>
    <rect x="8" y="12" width="4" height="28" rx="2" fill="url(#goldGrad)"/>
    <rect x="16" y="24" width="4" height="16" rx="2" fill="url(#goldGrad)" opacity="0.5"/>
  </g>
</svg>
